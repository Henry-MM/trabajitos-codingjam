<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1c2420;--muted:#65706a;--line:#e3ddd1;--brand:#0e6b57;--brand-2:#0a5544;--brand-soft:#e2f0ea;--pend:#8a5a00;--pend-soft:#fdf1d8;--star:#d99a00;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:120px}
h1{font-size:26px;line-height:1.2;margin:18px 0 6px;letter-spacing:-.01em}
h2{font-size:19px;margin:18px 0 12px}
h3{font-size:16px;margin:0 0 10px}
button,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.narrow{max-width:640px}
.muted{color:var(--muted)} .sm{font-size:13px}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:baseline;gap:10px;padding-top:14px;padding-bottom:14px}
.logo{font-weight:800;font-size:20px;color:var(--brand);letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.btn{background:var(--brand);color:#fff;border:1.5px solid var(--brand);border-radius:10px;padding:12px 18px;font-weight:650}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:var(--card);color:var(--brand)}
.btn.big{width:100%;padding:15px;font-size:16px;margin-top:20px}
.btn.sm{padding:8px 12px;font-size:13px}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:8px 0}
.lbl{display:block;font-weight:650;margin:18px 0 6px}
textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--card);color:var(--ink)}
textarea:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}

/* request */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-weight:600}
.cat span{font-size:22px}
.cat.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:8px 12px;font-size:14px}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2);font-weight:600}
.fine{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}

/* shared bits */
.reqbar{background:var(--card);border-bottom:1px solid var(--line)}
.reqbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;font-size:14px}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;background:var(--c)}
.stars{color:var(--star);font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.b{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.b.ok{background:var(--brand-soft);color:var(--brand-2)}
.b.pend{background:var(--pend-soft);color:var(--pend)}
.near{font-size:12px;font-weight:600;color:var(--brand)}
.far{font-size:12px;color:var(--muted)}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:4/3;border-radius:10px;background:linear-gradient(135deg,hsl(var(--h) 45% 80%),hsl(var(--h) 38% 58%));display:flex;flex-direction:column;justify-content:space-between;padding:8px}
.ph span{font-size:28px}
.ph small{font-size:11px;font-weight:600;background:rgba(255,255,255,.8);border-radius:6px;padding:2px 6px;align-self:flex-start}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0;padding-top:0}
.rev .h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.rev p{margin:6px 0 4px}
.rev .paid{font-size:12px;color:var(--brand);font-weight:600}
.rev.mine{background:var(--brand-soft);border-radius:10px;padding:12px;border:0;margin-bottom:8px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.ic.ok{background:var(--brand-soft);color:var(--brand)}
.ic.pend{background:var(--pend-soft);color:var(--pend)}
.ic.info{background:#eeebe4;color:var(--muted)}

/* A */
.list{display:grid;gap:10px}
.cardA{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer}
.cardA:hover{border-color:var(--brand);box-shadow:0 4px 16px rgba(14,107,87,.08)}
.cardA .grow{flex:1;min-width:0}
.cardA .nm{font-weight:700;font-size:16px}
.cardA .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.price{font-weight:700}
@media(max-width:620px){.cardA{flex-wrap:wrap}.cardA .side{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;text-align:left}}
.pgrid{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
.pgrid>div{display:grid;gap:16px}
@media(max-width:820px){.pgrid{grid-template-columns:1fr}}
.hero{display:grid;gap:10px}
.hero .who{display:flex;gap:14px;align-items:center}
.hero .who b{font-size:20px;display:block}
.cta{display:grid;gap:8px}

/* B */
.cmp{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.cmp table{border-collapse:separate;border-spacing:0;width:100%}
.cmp th,.cmp td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:center;min-width:170px;vertical-align:middle;font-size:14px}
.cmp th:first-child,.cmp td:first-child{position:sticky;left:0;background:#faf8f3;text-align:left;min-width:140px;font-weight:600;font-size:13px;z-index:1;border-right:1px solid var(--line)}
.cmp thead th{vertical-align:top}
.cmp thead .av{margin:0 auto 6px}
.cmp td.best{background:var(--brand-soft);font-weight:700}
.cmp td.best::after{content:"mejor";display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand)}
.cmp .quote{font-size:12px;color:var(--muted);font-style:italic;text-align:left}
.cmp .acts{display:grid;gap:6px}
.scrim{position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);z-index:21;overflow:auto;padding:16px 16px 130px;box-shadow:-10px 0 30px rgba(0,0,0,.15);display:grid;gap:14px;align-content:start}

/* C */
.prog{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;font-size:14px}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand)}
.cC{display:grid;gap:18px}
.cC .who{text-align:center;display:grid;justify-items:center;gap:4px}
.cC .who b{font-size:22px}
.level{border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.level.hi{background:var(--brand-soft)} .level.mid{background:#eef3e6} .level.lo{background:var(--pend-soft)}
.meter{height:8px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.level.lo .meter i{background:var(--pend)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.facts div{background:#faf8f3;border-radius:10px;padding:10px 4px}
.facts b{display:block;font-size:20px}
details summary{cursor:pointer;font-weight:650;color:var(--brand)}
details[open] summary{margin-bottom:12px}
.decide{position:sticky;bottom:78px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;background:var(--bg);padding:8px 0}

/* hired */
.done{display:grid;gap:12px;margin-top:20px}
.okbig{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:28px}
.steps{margin:0;padding-left:20px;display:grid;gap:10px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:18px;font-weight:800;letter-spacing:.2em;background:var(--brand-soft);color:var(--brand-2);padding:2px 8px;border-radius:6px}

/* D: Indeed-style search + split list/detail */
body:has(.vD){background:#fff}
.vD{--brand:#2557a7;--brand-2:#164081;--brand-soft:#eef2fb;--ink:#2d2d2d;--muted:#6f6f6f;--line:#d4d2d0;--bg:#fff;--ok:#17663a;--ok-soft:#e4f4ea;color:var(--ink);font-family:"Noto Sans","Segoe UI",system-ui,sans-serif}
.vD .b.ok,.vD .ic.ok{background:var(--ok-soft);color:var(--ok)}
.d-wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.d-top{border-bottom:1px solid var(--line);background:#fff}
.d-top .d-wrap{display:flex;align-items:center;gap:22px;height:60px;font-size:14px}
.d-logo{font-weight:800;font-size:22px;color:var(--brand);letter-spacing:-.03em}
.d-nav{font-weight:600;height:60px;display:flex;align-items:center}
.d-nav.on{box-shadow:inset 0 -3px 0 var(--brand)}
.d-right{color:var(--brand);font-weight:600}
.grow{flex:1}
@media(max-width:820px){.d-hide-m{display:none!important}}
.d-search{display:flex;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.08);background:#fff;padding:6px;gap:4px}
.d-search.big{padding:8px;font-size:16px}
.d-field{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0}
.d-field+.d-field{border-left:1px solid var(--line)}
.d-field input,.d-field select{border:0;outline:0;width:100%;padding:10px 0;font:inherit;background:transparent;color:var(--ink)}
.d-field:focus-within{box-shadow:inset 0 -2px 0 var(--brand)}
@media(max-width:620px){.d-search{flex-direction:column}.d-field+.d-field{border-left:0;border-top:1px solid var(--line)}}
.d-btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-weight:700}
.d-btn:hover{background:var(--brand-2)}
.d-btn.big{width:100%;padding:14px;font-size:16px;margin-top:14px}
.d-home{max-width:860px;margin:0 auto;padding:56px 16px}
.d-home h1{text-align:center;font-size:28px;margin:0 0 22px}
.d-pop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;font-size:14px}
.d-pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink)}

.d-promise{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:40px}

.d-list{display:grid;gap:12px}
.d-card{border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;background:#fff}

.d-tag.pend{background:var(--pend-soft);color:var(--pend)}
.d-card ul{margin:0;padding-left:18px;font-size:13px;color:#595959;display:grid;gap:2px}
.d-foot{font-size:12px;color:var(--muted);margin-top:10px}
.d-pane{position:sticky;top:12px;border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 24px);overflow:auto;background:#fff}
.d-dhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:18px 20px;z-index:2;box-shadow:0 4px 8px -6px rgba(0,0,0,.15)}
.d-dhead h2{margin:0;font-size:22px}
.d-actions{display:flex;gap:8px;margin-top:12px}
.d-icon{width:46px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px}
.d-icon.on{color:#c4232f}
.d-dbody section{padding:18px 20px;border-bottom:1px solid var(--line)}
.d-dbody section:last-child{border-bottom:0}
.d-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.d-dl dt{color:var(--muted)} .d-dl dd{margin:0;font-weight:600}
.d-mback{display:none;padding:10px 20px 0}
.d-empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:10px}
@media(max-width:820px){
  .d-split{grid-template-columns:1fr}
  .d-pane{display:none;position:static;max-height:none;overflow:visible}
  .d-split.show .d-list{display:none}
  .d-split.show .d-pane{display:block}
  .d-mback{display:block}
}
.d-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:14px;z-index:21;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.d-mhead{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.d-mhead button{border:0;background:none;font-size:20px;color:var(--muted)}
.d-in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
.d-in:focus{outline:2px solid var(--brand);border-color:transparent}

/* prototype switcher — hidden in the MVP */
#pbar{display:none!important}
body{padding-bottom:24px}
#pbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;background:#111;color:#fff;border-radius:999px;display:flex;align-items:center;gap:8px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.35);outline:2px dashed #ffcf33;outline-offset:2px;font:13px/1.2 system-ui,sans-serif;max-width:calc(100% - 24px)}
#pbar button{width:34px;height:34px;border-radius:50%;border:0;background:#2b2b2b;color:#fff;font-size:15px;flex:none}
#pbar button:hover{background:#444}
#pbar .lab{padding:0 4px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar .lab small{display:block;color:#aaa;font-size:11px}
</style>
</head>

const STEP_ES={request:'solicitud',results:'resultados',profile:'perfil',hired:'contratado'};
const VARIANTS=[['D','Estilo Indeed']];
const state={
  variant:'D',
  f:{verified:false,top:false,near:false,sort:'rel'}, modal:null, saved:new Set(),
  step:'request', // request | results | profile | hired
  req:{cat:'plomeria',what:'Plomero',desc:'El inodoro no deja de correr agua y el tanque gotea.',zona:'Col. Palmira',when:'Hoy',addr:''},
  sel:null, idx:0,
};
if(!VARIANTS.some(v=>v[0]===state.variant)) state.variant='D';

const $app=document.getElementById('app'), $bar=document.getElementById('pbar');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=n=>'L'+n.toLocaleString('en-US');
const byId=id=>W.find(w=>w.id===id);
const first=w=>w.name.split(' ')[0];
const catName=()=>CATS.find(c=>c.id===state.req.cat).name;
const isNear=w=>w.zonas.includes(state.req.zona);
const score=w=>(w.idVerified?2:0)+(w.bg==='ok'?2:0)+w.rating*Math.log10(w.reviews+1)+(w.certs.length?1:0);
function matches(){
  const l=W.filter(w=>state.req.cat==='otro'||w.cats.includes(state.req.cat));
  return l.sort((a,b)=>(isNear(b)-isNear(a))||(score(b)-score(a)));
}
const avatar=(w,s)=>`<div class="av" style="--c:${w.color};width:${s}px;height:${s}px;font-size:${Math.round(s*.36)}px">${w.name.split(' ').slice(0,2).map(p=>p[0]).join('')}</div>`;
const nearTag=w=>isNear(w)?`<span class="near">📍 Atiende ${esc(state.req.zona)}</span>`:`<span class="far">Atiende: ${w.zonas.slice(0,2).join(', ')}</span>`;
const badges=w=>`<div class="badges">
  <span class="b ${w.idVerified?'ok':'pend'}">${w.idVerified?'✓ Identidad verificada':'⏳ Identidad sin verificar'}</span>
  <span class="b ${w.bg==='ok'?'ok':'pend'}">${w.bg==='ok'?'✓ Sin antecedentes':'⏳ Antecedentes en revisión'}</span>
  ${w.certs.length?'<span class="b ok">✓ Certificado</span>':''}</div>`;
const photos=w=>`<div class="phs">${w.photos.map(([e,t],i)=>`<div class="ph" style="--h:${(w.id*47+i*60)%360}"><span>${e}</span><small>${t}</small></div>`).join('')}</div>`;
function reviews(w,mineFirst){
  let rs=[...w.revs];
  if(mineFirst) rs.sort((a,b)=>(b.zona===state.req.zona)-(a.zona===state.req.zona));
  return rs.map(r=>{const mine=mineFirst&&r.zona===state.req.zona;
    return `<div class="rev ${mine?'mine':''}"><div class="h"><b>${r.who} · ${mine?'📍 vecina/o de '+r.zona:r.zona}</b><span class="stars">${'★'.repeat(r.stars)}</span></div>
    <p>${r.text}</p><div class="sm muted">${r.date} · <span class="paid">✓ Trabajo pagado en Trabajitos</span></div></div>`}).join('');
}
function signals(w){
  return [
    {st:w.idVerified?'ok':'pend',label:'Identidad verificada',detail:w.idVerified?'DNI revisado y selfie confirmada con el documento':'Aún no completa la verificación de DNI'},
    {st:w.bg==='ok'?'ok':'pend',label:'Antecedentes penales y policíacos',detail:w.bg==='ok'?`Sin antecedentes · revisado ${w.bgDate}`:'En revisión — normalmente toma 3 a 5 días'},
    {st:w.reviews>=10?'ok':'info',label:`${w.rating} ★ de ${w.reviews} clientes`,detail:w.reviews>=10?'Solo opinan clientes que pagaron un trabajo':'Pocas reseñas todavía: es nuevo en la plataforma'},
    {st:'info',label:`${w.jobs} trabajitos completados`,detail:`En Trabajitos desde ${w.since}`},
    {st:w.certs.length?'ok':'info',label:w.certs.length?w.certs.join(' · '):'Sin certificación registrada',detail:`${w.years} años de experiencia`},
    {st:'info',label:`Responde en ~${w.response}`,detail:`Precio típico ${q(w.price[0])}–${q(w.price[1])} · visita de diagnóstico L150`},
  ];
}
const icon={ok:'✓',pend:'⏳',info:'•'};
const checklist=w=>`<ul class="checks">${signals(w).map(s=>`<li><span class="ic ${s.st}">${icon[s.st]}</span><div><b>${s.label}</b><div class="sm muted">${s.detail}</div></div></li>`).join('')}</ul>`;
function trustLevel(w){
  const pct=Math.round((w.idVerified?25:0)+(w.bg==='ok'?25:0)+Math.min(w.reviews,30)/30*25+(w.certs.length?10:0)+Math.min(w.jobs,50)/50*15);
  const why=[];
  if(!w.idVerified) why.push('identidad sin verificar');
  if(w.bg!=='ok') why.push('antecedentes en revisión');
  if(w.reviews<10) why.push('pocas reseñas');
  if(pct>=80) return {k:'hi',label:'Alta',pct,why:'Verificado, sin antecedentes y con muchas reseñas de clientes reales.'};
  if(pct>=50) return {k:'mid',label:'Media',pct,why:'Ojo: '+why.join(', ')+'.'};
  return {k:'lo',label:'En construcción',pct,why:'Ojo: '+why.join(', ')+'.'};
}

/* ---------- Variant B: side-by-side comparison table, profile in a drawer ---------- */
function viewB(){
  const l=matches();
  const ok=(v,t,f)=>v?`<span class="b ok">✓ ${t}</span>`:`<span class="b pend">⏳ ${f}</span>`;
  const rows=[
    ['Identidad',w=>ok(w.idVerified,'Verificada','Sin verificar')],
    ['Antecedentes',w=>ok(w.bg==='ok','Limpios','En revisión')],
    ['Calificación',w=>`<span class="stars">★ ${w.rating}</span>`,w=>w.rating,'max'],
    ['Reseñas',w=>w.reviews,w=>w.reviews,'max'],
    ['Trabajos completados',w=>w.jobs,w=>w.jobs,'max'],
    ['Experiencia',w=>w.years+' años',w=>w.years,'max'],
    ['Certificación',w=>w.certs[0]?`<span class="sm">${w.certs[0]}</span>`:'<span class="muted">—</span>'],
    ['Atiende tu colonia',w=>isNear(w)?'📍 Sí':'<span class="muted">No</span>'],
    ['Responde en',w=>'~'+w.response,w=>-w.respMin,'max'],
    ['Precio típico',w=>`${q(w.price[0])}–${q(w.price[1])}`,w=>-w.price[0],'max'],
    ['Reseña reciente',w=>`<div class="quote">“${w.revs[0].text.slice(0,80)}${w.revs[0].text.length>80?'…':''}”</div>`],
  ];
  const body=rows.map(([label,cell,num])=>{
    const best=num?Math.max(...l.map(num)):null;
    return `<tr><td>${label}</td>${l.map(w=>`<td class="${num&&l.length>1&&num(w)===best?'best':''}">${cell(w)}</td>`).join('')}</tr>`;
  }).join('');
  const table=`<div class="cmp"><table>
    <thead><tr><th>${l.length} opciones</th>${l.map(w=>`<th>${avatar(w,48)}<div>${w.name}</div><div class="muted sm" style="font-weight:400">${w.oficio}</div></th>`).join('')}</tr></thead>
    <tbody>${body}
    <tr><td></td>${l.map(w=>`<td><div class="acts"><button class="btn sm" data-act="hire" data-id="${w.id}">Contratar</button><button class="btn ghost sm" data-act="open" data-id="${w.id}">Ver perfil</button></div></td>`).join('')}</tr>
    </tbody></table></div>`;
  let drawer='';
  if(state.step==='profile'){
    const w=byId(state.sel);
    drawer=`<div class="scrim" data-act="close"></div><aside class="drawer">
      <button class="link" data-act="close" style="justify-self:start">✕ Seguir comparando</button>
      <div style="display:flex;gap:12px;align-items:center">${avatar(w,64)}<div><b style="font-size:18px">${w.name}</b><div class="muted">${w.oficio} · <span class="stars">★ ${w.rating}</span> (${w.reviews})</div></div></div>
      ${badges(w)}
      <p style="margin:0">${w.bio}</p>
      <section class="card"><h3>Trabajos anteriores</h3>${photos(w)}</section>
      <section class="card"><h3>Reseñas</h3>${reviews(w,false)}</section>
      <section class="card"><h3>Verificaciones</h3>${checklist(w)}</section>
      <button class="btn" data-act="hire" data-id="${w.id}">Contratar a ${first(w)}</button>
    </aside>`;
  }
  return `${reqSummary()}<main class="wrap"><h2>Compara antes de elegir</h2>${table}</main>${drawer}`;
}

  ['electricidad',/electr|luz|corto|enchufe|toma|l[aá]mpara|breaker|tablero/],
  ['soldadura',/sold|port[oó]n|metal|herrer|balc/],
  ['construccion',/constr|alba[nñ]|muro|pared|piso|obra|remodel|azulejo|repello|pint/],
];
const catFromText=t=>(CAT_WORDS.find(([,r])=>r.test(t.toLowerCase()))||['otro'])[0];
const POP=['Plomero','Electricista','Soldador','Albañil','Fuga de agua','Todero'];
const headerD=()=>`<header class="d-top"><div class="d-wrap"><span class="d-logo">trabajitos</span><span class="d-nav on d-hide-m">Buscar profesionales</span><span class="d-nav d-hide-m">Mis solicitudes</span><span class="grow"></span><span class="d-right d-hide-m">Ofrecer mis servicios</span><span class="d-right">Iniciar sesión</span></div></header>`;
const searchD=big=>`<div class="d-search ${big?'big':''}">
  <label class="d-field"><span>🔍</span><input id="what" value="${esc(state.req.what)}" placeholder="Oficio o problema: plomero, fuga, portón…" autocomplete="off"></label>
  <label class="d-field"><span>📍</span><select id="zonaD">${ZONAS.map(z=>`<option ${z===state.req.zona?'selected':''}>${z}</option>`).join('')}</select></label>
  <button class="d-btn" data-act="searchD">Buscar</button></div>`;
function listD(){
  const f=state.f;
  const l=matches().filter(w=>(!f.verified||(w.idVerified&&w.bg==='ok'))&&(!f.top||w.rating>=4.7)&&(!f.near||isNear(w)));
  const by={rating:(a,b)=>b.rating-a.rating||b.reviews-a.reviews,price:(a,b)=>a.price[0]-b.price[0],resp:(a,b)=>a.respMin-b.respMin}[f.sort];
  return by?l.sort(by):l;
}
const verifiedTag=w=>w.idVerified&&w.bg==='ok'?'<span class="d-tag ok">✓ Verificado</span>'
  :`<span class="d-tag pend">⏳ ${w.idVerified?'Antecedentes en revisión':'Identidad sin verificar'}</span>`;
const cardD=(w,sel)=>`<article class="d-card ${sel?'sel':''}" data-act="open" data-id="${w.id}">
  ${w.rating>=4.8&&w.reviews>=30?'<span class="flag">★ Muy recomendado</span>':''}
  <div style="display:flex;gap:12px;align-items:flex-start">${avatar(w,44)}<div style="min-width:0"><h3>${w.name}</h3><div class="d-sub">${w.oficio}</div><div class="d-sub muted">${w.zonas.join(' · ')}</div></div></div>
  <div class="sm" style="margin-top:8px"><span class="stars">★ ${w.rating}</span> <span class="muted">(${w.reviews} reseñas)</span></div>
  <div class="d-tags">${verifiedTag(w)}<span class="d-tag">${q(w.price[0])}–${q(w.price[1])}</span><span class="d-tag">Responde en ~${w.response}</span></div>
  <ul><li>${w.bio}</li><li>“${w.revs[0].text.slice(0,90)}${w.revs[0].text.length>90?'…':''}”</li></ul>
  <div class="d-foot">${w.jobs} trabajos completados · en Trabajitos desde ${w.since}</div>
</article>`;
function detailD(w){
  const saved=state.saved.has(w.id);
  return `<div class="d-mback"><button class="link" data-act="back">← Volver a resultados</button></div>
  <div class="d-dhead">
    <div style="display:flex;gap:14px;align-items:center">${avatar(w,56)}<div><h2>${w.name}</h2><div>${w.oficio} · ${nearTag(w)}</div></div></div>
    <div class="sm" style="margin-top:8px"><span class="stars">★ ${w.rating}</span> · ${w.reviews} reseñas · ${w.jobs} trabajos</div>
    <div style="margin-top:4px;font-weight:600">${q(w.price[0])}–${q(w.price[1])} <span class="muted" style="font-weight:400">· visita de diagnóstico L150</span></div>
    <div class="d-actions"><button class="d-btn" data-act="hire" data-id="${w.id}">Contratar a ${first(w)}</button><button class="d-icon ${saved?'on':''}" data-act="save" data-id="${w.id}" title="Guardar">${saved?'♥':'♡'}</button></div>
  </div>
  <div class="d-dbody">
    <section><h3>Confianza y verificaciones</h3>${checklist(w)}</section>
    <section><h3>Detalles del servicio</h3><dl class="d-dl">
      <dt>Oficio</dt><dd>${w.oficio}</dd><dt>Experiencia</dt><dd>${w.years} años</dd>
      <dt>Certificación</dt><dd>${w.certs.join(', ')||'—'}</dd><dt>Precio típico</dt><dd>${q(w.price[0])}–${q(w.price[1])}</dd>
      <dt>Responde en</dt><dd>~${w.response}</dd><dt>Colonias</dt><dd>${w.zonas.join(', ')}</dd></dl></section>
    <section><h3>Sobre ${first(w)}</h3><p style="margin:0">${w.bio}</p></section>
    <section><h3>Trabajos anteriores</h3>${photos(w)}</section>
    <section><h3>Reseñas</h3>${reviews(w,true)}</section>
  </div>`;
}
function modalD(){
  const w=byId(state.modal), r=state.req;
  return `<div class="scrim" data-act="closeModal"></div><div class="d-modal" role="dialog" aria-label="Contratar">
  <div class="d-mhead"><b>Contratar a ${w.name}</b><button data-act="closeModal" aria-label="Cerrar">✕</button></div>
  <div class="sm muted">${w.oficio} · <span class="stars">★ ${w.rating}</span> (${w.reviews}) · ${q(w.price[0])}–${q(w.price[1])}</div>
  ${badges(w)}
  <label class="lbl" for="desc">Describe el problema</label><textarea id="desc" rows="3" placeholder="Ej: el inodoro no deja de correr agua">${esc(r.desc)}</textarea>
  <label class="lbl">¿Cuándo?</label><div class="chips">${WHEN.map(x=>`<button class="chip ${r.when===x?'on':''}" data-act="when" data-id="${x}">${x}</button>`).join('')}</div>
  <label class="lbl" for="addr">Dirección o referencia</label><input class="d-in" id="addr" value="${esc(r.addr)}" placeholder="Ej: ${esc(r.zona)}, bloque B, casa 24, frente a la pulpería">
  <p class="sm muted">🔒 Tu dirección solo se comparte con ${first(w)} cuando confirme la visita.</p>
  <button class="d-btn big" data-act="send">Enviar solicitud</button></div>`;
}
function viewD(){
  if(state.step==='request') return headerD()+`<main class="d-home"><h1>Encuentra gente de confianza para tu casa</h1>${searchD(true)}
    <div class="d-pop"><span class="muted">Búsquedas populares:</span>${POP.map(p=>`<button class="d-pill" data-act="pop" data-id="${p}">${p}</button>`).join('')}</div>
    <div class="d-promise"><div><b>✓ Identidad verificada</b>Revisamos el DNI de cada profesional.</div><div><b>✓ Antecedentes revisados</b>Penales y policíacos. Si están pendientes, te lo decimos.</div><div><b>✓ Reseñas reales</b>Solo opinan clientes que pagaron un trabajo.</div></div></main>`;
  if(state.step==='hired') return headerD()+viewHired();
  const l=listD(), f=state.f, selW=l.find(w=>w.id===state.sel)||l[0];
  const pill=(k,t)=>`<button class="d-pill ${f[k]?'on':''}" data-act="filt" data-id="${k}">${t}</button>`;
  return headerD()+`<div class="d-searchbar"><div class="d-wrap">${searchD(false)}</div></div>
  <div class="d-wrap">
    <div class="d-filters">${pill('verified','✓ Solo verificados')}${pill('top','★ 4.7 o más')}${pill('near','📍 Atiende mi colonia')}
      <label class="d-sort">Ordenar por: <select id="sortD">${[['rel','Relevancia'],['rating','Calificación'],['price','Precio más bajo'],['resp','Responde más rápido']].map(([k,t])=>`<option value="${k}" ${f.sort===k?'selected':''}>${t}</option>`).join('')}</select></label></div>
    <div class="d-count">${l.length} profesionales de <b>${catName()}</b> en ${esc(state.req.zona)}</div>
    ${l.length?`<div class="d-split ${state.step==='profile'?'show':''}"><div class="d-list">${l.map(w=>cardD(w,w===selW)).join('')}</div><div class="d-pane">${detailD(selW)}</div></div>`
      :`<div class="d-empty"><b>Ningún profesional cumple estos filtros.</b><br><button class="link" data-act="clearF">Quitar filtros</button></div>`}
  </div>${state.modal?modalD():''}`;
}
function searchFromD(){state.req.cat=catFromText(state.req.what);state.step='results';state.sel=null}

/* ---------- render + actions ---------- */
function render(){
  if(state.variant==='D') $app.innerHTML=`<div class="vD">${viewD()}</div>`;
  else{
    let html;
    if(state.step==='request') html=viewRequest();
    else if(state.step==='hired') html=viewHired();
    else html={A:viewA,B:viewB,C:viewC}[state.variant]();
    $app.innerHTML=header()+html;
  }
  const v=VARIANTS.find(x=>x[0]===state.variant);
  $bar.innerHTML=`<button data-pv="-1" title="Variante anterior (←)">◀</button>
    <div class="lab"><b>${v[0]}</b> · ${v[1]}<small>${state.variant!=='D'&&(state.step==='request'||state.step==='hired')?'<span style="color:#ffcf33">pantalla igual en A/B/C</span> · ':''}paso: ${STEP_ES[state.step]} ·${matches().length} resultados${state.sel?' · elegido: '+first(byId(state.sel)):''}</small></div>
    <button data-pv="1" title="Siguiente variante (→)">▶</button>`;
}
function setVariant(k){
  state.variant=k;
  try{const u=new URL(location.href);u.searchParams.set('variant',k);history.replaceState(null,'',u)}catch(e){}
  render();
}
function cycle(d){const i=VARIANTS.findIndex(v=>v[0]===state.variant);setVariant(VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length][0])}

document.addEventListener('click',e=>{
  const pv=e.target.closest('[data-pv]'); if(pv){cycle(+pv.dataset.pv);return}
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id, l=matches();
  let top=true;
  switch(act){
    case 'cat': state.req.cat=id; top=false; break;
    case 'when': state.req.when=id; top=false; break;
    case 'search': state.step='results'; state.idx=0; state.sel=null; break;
    case 'edit': state.step='request'; break;
    case 'open': state.sel=+id; state.idx=Math.max(0,l.findIndex(w=>w.id===+id)); state.step='profile';
      top=state.variant==='D'?window.innerWidth<820:state.variant!=='B'; break;
    case 'close': state.step='results'; top=false; break;
    case 'back': state.step=state.step==='hired'?'profile':'results'; break;
    case 'hire': if(state.variant==='D'){state.modal=+id;top=false;break}
      state.sel=+id; state.step='hired'; break;
    case 'send': state.sel=state.modal; state.modal=null; state.step='hired'; break;
    case 'closeModal': state.modal=null; top=false; break;
    case 'searchD': searchFromD(); break;
    case 'pop': state.req.what=id; searchFromD(); break;
    case 'filt': state.f[id]=!state.f[id]; top=false; break;
    case 'clearF': Object.assign(state.f,{verified:false,top:false,near:false}); top=false; break;
    case 'save': state.saved.has(+id)?state.saved.delete(+id):state.saved.add(+id); top=false; break;
    case 'next': state.idx++; state.sel=null; break;
    case 'prev': state.idx=Math.max(0,state.idx-1); break;
    case 'first': state.idx=0; break;
    case 'share': alert('(Prototipo) Se enviaría por WhatsApp: nombre, foto y código de visita del profesional, con la dirección y hora.'); return;
    case 'restart': state.step='request'; state.sel=null; state.idx=0; break;
  }
  render(); if(top) window.scrollTo(0,0);
});
document.addEventListener('input',e=>{
  if(e.target.id==='desc') state.req.desc=e.target.value;
  if(e.target.id==='zona'||e.target.id==='zonaD') state.req.zona=e.target.value;
  if(e.target.id==='what') state.req.what=e.target.value;
  if(e.target.id==='addr') state.req.addr=e.target.value;
});
document.addEventListener('change',e=>{
  if(e.target.id==='sortD'){state.f.sort=e.target.value;render()}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.id==='what'){searchFromD();render();return}
  if(e.key==='Escape'&&state.modal){state.modal=null;render();return}
  if(t.matches('input,textarea,select,[contenteditable]')) return;
});
render();
</script>
</body>
</html>
