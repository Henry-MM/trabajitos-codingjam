const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const score=w=>(w.idVerified?2:0)+(w.bg==='ok'?2:0)+w.rating*Math.log10(w.reviews+1)+(w.certs.length?1:0);
function matches(){
  const l=W.filter(w=>state.req.cat==='otro'||w.cats.includes(state.req.cat));

}

function reviews(w,mineFirst){
  let rs=[...w.revs];
  if(mineFirst) rs.sort((a,b)=>(b.zona===state.req.zona)-(a.zona===state.req.zona));

    return `<div class="rev ${mine?'mine':''}"><div class="h"><b>${r.who} · ${mine?'📍 vecina/o de '+r.zona:r.zona}</b><span class="stars">${'★'.repeat(r.stars)}</span></div>

function signals(w){
  return [

/* ---------- Indeed-style search bar + list left / detail right ---------- */
const CAT_WORDS=[
  ['plomeria',/plom|inodoro|fuga|agua|tuber|grifo|llave|calentador|drenaje|destap/],
  ['electricidad',/electr|luz|corto|enchufe|toma|l[aá]mpara|breaker|tablero/],
  ['soldadura',/sold|port[oó]n|metal|herrer|balc/],
  ['construccion',/constr|alba[nñ]|muro|pared|piso|obra|remodel|azulejo|repello|pint/],
];
const catFromText=t=>(CAT_WORDS.find(([,r])=>r.test(t.toLowerCase()))||['otro'])[0];
const POP=['Plomero','Electricista','Soldador','Albañil','Fuga de agua','Todero'];
const headerD=()=>`<header class="d-top"><div class="d-wrap"><a class="d-logo" href="/">trabajitos</a><span class="d-nav on d-hide-m">Buscar profesionales</span><span class="d-nav d-hide-m">Mis solicitudes</span><span class="grow"></span><span class="d-right d-hide-m">Ofrecer mis servicios</span><span class="d-right">Iniciar sesión</span></div></header>`;
const searchD=big=>`<div class="d-search ${big?'big':''}">
  <label class="d-field"><span>🔍</span><input id="what" value="${esc(state.req.what)}" placeholder="Oficio o problema: plomero, fuga, portón…" autocomplete="off"></label>
  <label class="d-field"><span>📍</span><select id="zonaD">${ZONAS.map(z=>`<option ${z===state.req.zona?'selected':''}>${z}</option>`).join('')}</select></label>
  <button class="d-btn" data-act="searchD">Buscar</button></div>`;
function listD(){
  const f=state.f;
  const l=matches().filter(w=>(!f.verified||(w.idVerified&&w.bg==='ok'))&&(!f.top||w.rating>=4.7)&&(!f.near||isNear(w)));
  const by={rating:(a,b)=>b.rating-a.rating||b.reviews-a.reviews,price:(a,b)=>a.price[0]-b.price[0],resp:(a,b)=>a.respMin-b.respMin}[f.sort];
  return by?l.sort(by):l;
}
const verifiedTag=w=>w.idVerified&&w.bg==='ok'?'<span class="d-tag ok">✓ Verificado</span>'
  :`<span class="d-tag pend">⏳ ${w.idVerified?'Antecedentes en revisión':'Identidad sin verificar'}</span>`;
const cardD=(w,sel)=>`<article class="d-card ${sel?'sel':''}" data-act="open" data-id="${w.id}">
  ${w.rating>=4.8&&w.reviews>=30?'<span class="flag">★ Muy recomendado</span>':''}
  <div style="display:flex;gap:12px;align-items:flex-start">${avatar(w,44)}<div style="min-width:0"><h3>${w.name}</h3><div class="d-sub">${w.oficio}</div><div class="d-sub muted">${w.zonas.join(' · ')}</div></div></div>
  <div class="sm" style="margin-top:8px"><span class="stars">★ ${w.rating}</span> <span class="muted">(${w.reviews} reseñas)</span></div>
  <div class="d-tags">${verifiedTag(w)}<span class="d-tag">${q(w.price[0])}–${q(w.price[1])}</span><span class="d-tag">Responde en ~${w.response}</span></div>
  <ul><li>${w.bio}</li><li>“${w.revs[0].text.slice(0,90)}${w.revs[0].text.length>90?'…':''}”</li></ul>
  <div class="d-foot">${w.jobs} trabajos completados · en Trabajitos desde ${w.since}</div>
</article>`;
function detailD(w){
  const saved=state.saved.has(w.id);
  return `<div class="d-mback"><button class="link" data-act="back">← Volver a resultados</button></div>
  <div class="d-dhead">
    <div style="display:flex;gap:14px;align-items:center">${avatar(w,56)}<div><h2>${w.name}</h2><div>${w.oficio} · ${nearTag(w)}</div></div></div>

function modalD(){
  const w=byId(state.modal), r=state.req;
  return `<div class="scrim" data-act="closeModal"></div><div class="d-modal" role="dialog" aria-label="Contratar">

function viewD(){
  if(state.step==='request') return headerD()+`<main class="d-home"><h1>Encuentra gente de confianza para tu casa</h1>${searchD(true)}
    <div class="d-pop"><span class="muted">Búsquedas populares:</span>${POP.map(p=>`<button class="d-pill" data-act="pop" data-id="${p}">${p}</button>`).join('')}</div>

  if(state.step==='hired') return headerD()+viewHired();
  const l=listD(), f=state.f, selW=l.find(w=>w.id===state.sel)||l[0];
  const pill=(k,t)=>`<button class="d-pill ${f[k]?'on':''}" data-act="filt" data-id="${k}">${t}</button>`;
  return headerD()+`<div class="d-searchbar"><div class="d-wrap">${searchD(false)}</div></div>

      <label class="d-sort">Ordenar por: <select id="sortD">${[['rel','Relevancia'],['rating','Calificación'],['price','Precio más bajo'],['resp','Responde más rápido']].map(([k,t])=>`<option value="${k}" ${f.sort===k?'selected':''}>${t}</option>`).join('')}</select></label></div>
    <div class="d-count">${l.length} profesionales de <b>${catName()}</b> en ${esc(state.req.zona)}</div>
    ${l.length?`<div class="d-split ${state.step==='profile'?'show':''}"><div class="d-list">${l.map(w=>cardD(w,w===selW)).join('')}</div><div class="d-pane">${detailD(selW)}</div></div>`
      :`<div class="d-empty"><b>Ningún profesional cumple estos filtros.</b><br><button class="link" data-act="clearF">Quitar filtros</button></div>`}
  </div>${state.modal?modalD():''}`;
}
function searchFromD(){state.req.cat=catFromText(state.req.what);state.step='results';state.sel=null}

/* ---------- render + actions ---------- */
function render(){
  $app.innerHTML=`<div class="vD">${viewD()}${state.lb?lightbox():''}</div>`;
  if(state.lb) $app.querySelector('[data-act=lbClose]').focus();
}
const lbNav=d=>{const n=byId(state.lb.id).photos.length;state.lb.i=(state.lb.i+d+n)%n};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  let top=true;
  switch(act){
    case 'when': state.req.when=id; top=false; break;
    case 'open': state.sel=+id; state.step='profile'; top=window.innerWidth<820; break;
    case 'back': state.step=state.step==='hired'?'profile':'results'; break;
    case 'hire': state.modal=+id; top=false; break;
    case 'send': state.sel=state.modal; state.modal=null; state.step='hired'; break;
    case 'closeModal': state.modal=null; top=false; break;
    case 'ph': state.lb={id:+id,i:+el.dataset.i}; top=false; break;
    case 'lbNav': lbNav(+id); top=false; break;
    case 'lbClose': state.lb=null; top=false; break;
    case 'searchD': searchFromD(); break;
    case 'pop': state.req.what=id; searchFromD(); break;
    case 'filt': state.f[id]=!state.f[id]; top=false; break;
    case 'clearF': Object.assign(state.f,{verified:false,top:false,near:false}); top=false; break;
    case 'save': state.saved.has(+id)?state.saved.delete(+id):state.saved.add(+id); top=false; break;
    case 'share': alert('(Prototipo) Se enviaría por WhatsApp: nombre, foto y código de visita del profesional, con la dirección y hora.'); return;
    case 'restart': state.step='request'; state.sel=null; break;
  }
  render(); if(top) window.scrollTo(0,0);
});
document.addEventListener('input',e=>{
  if(e.target.id==='desc') state.req.desc=e.target.value;
  if(e.target.id==='zona'||e.target.id==='zonaD') state.req.zona=e.target.value;
  if(e.target.id==='what') state.req.what=e.target.value;
  if(e.target.id==='addr') state.req.addr=e.target.value;
});
document.addEventListener('change',e=>{
  if(e.target.id==='sortD'){state.f.sort=e.target.value;render()}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.id==='what'){searchFromD();render();return}
  if(state.lb){
    if(e.key==='Escape') state.lb=null; else if(e.key==='ArrowLeft') lbNav(-1); else if(e.key==='ArrowRight') lbNav(1); else return;
    render(); return;
  }
  if(e.key==='Escape'&&state.modal){state.modal=null;render();return}
  if(t.matches('input,textarea,select,[contenteditable]')) return;
});
// Deep links from the landing page: /app/?q=fuga&colonia=Col.%20Palmira
const P=new URLSearchParams(location.search);
if(ZONAS.includes(P.get('colonia'))) state.req.zona=P.get('colonia');
if(P.get('q')){state.req.what=P.get('q').trim().slice(0,60);searchFromD()}
render();
</script>
</body>
</html>
